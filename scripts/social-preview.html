<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(135deg, #0d1117 0%, #10161f 55%, #161b22 100%);
    position: relative;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(ellipse 900px 500px at 60% 45%, rgba(0,0,0,0.9), transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse 900px 500px at 60% 45%, rgba(0,0,0,0.9), transparent 75%);
  }
  .glow {
    position: absolute;
    width: 900px; height: 560px;
    left: 430px; top: 60px;
    background: radial-gradient(ellipse at center, rgba(59,130,246,0.16) 0%, rgba(59,130,246,0.05) 45%, transparent 70%);
  }
  .left {
    position: absolute;
    left: 72px; top: 0; height: 640px; width: 380px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .logo {
    width: 96px; height: 96px;
    border-radius: 22px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.06);
  }
  .name {
    margin-top: 36px;
    font-size: 64px;
    font-weight: 700;
    color: #e6edf3;
    letter-spacing: -1px;
  }
  .name .accent { color: #4d9fff; }
  .tagline {
    margin-top: 18px;
    font-size: 24px;
    line-height: 1.45;
    color: #8b949e;
    max-width: 340px;
  }
  .tagline b { color: #c9d1d9; font-weight: 600; }
  .shot-wrap {
    position: absolute;
    right: 52px; top: 50%;
    transform: translateY(-50%) perspective(1600px) rotateY(-6deg) rotateX(1.5deg) rotate(-1deg);
  }
  .shot {
    width: 790px;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid rgba(240,246,252,0.14);
    box-shadow:
      0 30px 80px rgba(0,0,0,0.65),
      0 8px 24px rgba(0,0,0,0.5);
    display: block;
    line-height: 0;
  }
  .shot img { width: 790px; display: block; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="left">
    <img class="logo" src="icon.png">
    <div class="name">Pi<span class="accent">Wright</span></div>
    <div class="tagline">Desktop <b>workbench</b> for the <b>pi coding agent</b></div>
  </div>
  <div class="shot-wrap">
    <div class="shot"><img src="../docs/screenshots/chat.png"></div>
  </div>
</body>
</html>
