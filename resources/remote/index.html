<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101014">
<title>pi remote</title>
<link rel="icon" href="/icon.ico">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <div class="row">
    <div id="tabs" class="tabs" role="tablist" aria-label="Sessions" data-i18n-aria="Sessions"></div>
    <div class="side">
      <span id="dot" class="dot" title="PC link" data-i18n-title="PC link"></span>
      <button id="newSession" class="ghost" title="New session" data-i18n-title="New session">+</button>
    </div>
  </div>
  <div class="row sub">
    <span id="project"></span>
    <span id="model"></span>
    <span id="context"></span>
  </div>
</header>

<main id="stream" aria-live="polite"></main>

<button id="readExit" class="read-exit" hidden title="Exit read mode" data-i18n-title="Exit read mode"></button>

<div id="dialogs"></div>

<div id="createOverlay" hidden>
  <form id="createForm">
    <h2 data-i18n="New session">New session</h2>
    <label for="createName" data-i18n="Name">Name</label>
    <input id="createName" type="text" maxlength="100" placeholder="New Chat" autocomplete="off">
    <label for="createProject" id="createProjectRow" hidden data-i18n="Project">Project</label>
    <select id="createProject" hidden></select>
    <label for="createModel" data-i18n="Model">Model</label>
    <select id="createModel"></select>
    <label for="createThinking" id="createThinkingRow" data-i18n="Thinking">Thinking</label>
    <select id="createThinking"></select>
    <div class="row">
      <button type="button" id="createCancel" class="ghost" data-i18n="Cancel">Cancel</button>
      <button type="submit" id="createSubmit" data-i18n="Create">Create</button>
    </div>
  </form>
</div>

<footer>
  <div id="todo" class="todo" hidden></div>
  <div id="queue"></div>
  <div id="chips" hidden></div>
  <div id="loopBar" class="loop-bar" hidden>
    <label class="loop-toggle">
      <input id="loopCheck" type="checkbox">
      <span data-i18n="Loop">Loop</span>
    </label>
    <input id="loopMax" type="number" min="1" max="999" value="20" title="Loop iterations left" data-i18n-title="Loop iterations left">
    <span id="loopInfo" class="loop-info"></span>
  </div>
  <textarea id="loopExit" rows="1" placeholder="Loop exit condition (optional): the loop stops when the agent calls loop_stop; empty — until the iteration limit" data-i18n-ph="Loop exit condition (optional): the loop stops when the agent calls loop_stop; empty — until the iteration limit" hidden></textarea>
  <textarea id="input" rows="1" placeholder="Message…" data-i18n-ph="Message…" autocomplete="off"></textarea>
  <div class="row">
    <button id="attach" class="ghost" title="Attach image" data-i18n-title="Attach image">📎</button>
    <button id="tgNotify" class="ghost" title="Telegram notifications off" data-i18n-title="Telegram notifications off"></button>
    <button id="hideTools" class="ghost" title="Hide tool blocks" data-i18n-title="Hide tool blocks"></button>
    <button id="readMode" class="ghost" title="Read mode" data-i18n-title="Read mode"></button>
    <input id="file" type="file" accept="image/*" multiple hidden>
    <button id="stop" class="ghost" hidden data-i18n="Stop">Stop</button>
    <button id="steer" class="ghost" hidden data-i18n="Steer">Steer</button>
    <button id="send" data-i18n="Send">Send</button>
  </div>
</footer>

<script src="/app.js"></script>
</body>
</html>
